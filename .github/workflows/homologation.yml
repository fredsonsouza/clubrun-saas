name: Homologation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homologation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/club_run
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      TOKEN_PEPPER: ci-token-pepper-at-least-32-bytes-long
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-secret
      GOOGLE_OAUTH_CLIENT_REDIRECT_URI: https://ci.example.com/auth/callback
      RESEND_API_KEY: re_test_ci
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ci-mapbox-token
      NEXT_PUBLIC_APP_URL: https://ci.example.com
      NEXT_PUBLIC_API_URL: https://api.ci.example.com
      IMAGE_STORAGE_PROVIDER: fake
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: club_run
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d club_run"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saas/api db:migrate:deploy
      - run: pnpm --filter @saas/api test:e2e
      - run: pnpm --filter @saas/api test:integration:migration
      - run: pnpm --filter @saas/api build
      - run: NODE_ENV=production pnpm --filter @saas/api start > /tmp/clubrun-api.log 2>&1 &
      - run: sleep 3 && node scripts/smoke-api.mjs
      - if: always()
        run: cat /tmp/clubrun-api.log
